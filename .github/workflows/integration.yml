name: integration

# The integration suites (tests/integration/README.md):
#   database   Supabase's own Postgres image (17 and 15) + PostgREST: install, idempotency,
#              every check, pg_cron, upgrade, every SQL statement in the skill, the HTTP API
#   bridge     apps-script/Code.gs in an Apps Script runtime against that stack
#   google     the bridge in a real Google account and Supabase project (needs secrets)
#   claude     Claude runs the skill against fake connectors (needs ANTHROPIC_API_KEY)
# database and bridge run on every pull request. google and claude run nightly and on
# demand, and skip themselves when their secrets are not configured.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      claude:
        description: "Run the Claude scenarios (costs API usage)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database:
    name: Database on supabase/postgres:${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ["17.11.0.004", "15.19.0.004"]
    env:
      SUPABASE_PG_TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tests/integration/db/run.sh
      - if: always()
        run: tests/integration/stack/down.sh

  bridge:
    name: Bridge in an Apps Script runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: tests/integration/bridge/run.sh
      - if: always()
        run: tests/integration/stack/down.sh

  google:
    name: Bridge in real Google
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.LIFEOS_E2E_CLASPRC_JSON }}
      LIFEOS_E2E_SCRIPT_ID: ${{ secrets.LIFEOS_E2E_SCRIPT_ID }}
      LIFEOS_E2E_DB_URL: ${{ secrets.LIFEOS_E2E_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Secrets configured?
        id: secrets
        run: |
          if [ -n "$CLASPRC_JSON" ] && [ -n "$LIFEOS_E2E_SCRIPT_ID" ] && [ -n "$LIFEOS_E2E_DB_URL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Real-Google suite skipped: set LIFEOS_E2E_CLASPRC_JSON, LIFEOS_E2E_SCRIPT_ID and LIFEOS_E2E_DB_URL (tests/integration/README.md)."
          fi
      - if: steps.secrets.outputs.ok == 'true'
        run: tests/integration/gas-e2e/run.sh

  claude:
    name: Claude runs the skill
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.claude)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LIFEOS_IT_MODEL: ${{ vars.LIFEOS_IT_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: API key configured?
        id: secrets
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Claude suite skipped: set the ANTHROPIC_API_KEY secret."; fi
      - if: steps.secrets.outputs.ok == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.288
      - if: steps.secrets.outputs.ok == 'true'
        run: tests/integration/claude/run.sh
      - if: always() && steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-transcripts
          path: |
            tests/integration/claude/.state/*/transcript.jsonl
            tests/integration/claude/.state/*/calls.jsonl
            tests/integration/claude/.state/*/report.json
            tests/integration/claude/.state/*/world.json
          retention-days: 14
      - if: always()
        run: tests/integration/stack/down.sh
