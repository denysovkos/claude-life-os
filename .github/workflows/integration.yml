name: integration

# The integration suites (tests/integration/README.md):
#   database   Supabase's own Postgres image (17 and 15) + PostgREST: install, idempotency,
#              every check, pg_cron, upgrade, every SQL statement in the skill, the HTTP API
#   bridge     apps-script/Code.gs in an Apps Script runtime against that stack
#   google     the bridge in a real Google account and Supabase project (needs secrets)
#   agent      a scripted agent in Claude's place runs the workflows, and a compromised one
#              tries what an injected letter asks, through fake connectors
# database, bridge and agent run on every pull request; no model is ever called.
# google runs nightly and on demand, and skips itself when its secrets are not configured.
# tests/test_release.py checks this file still declares these jobs: from 17 to 20 October
# a bad edit had removed them, and every push failed before a single test ran.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database:
    name: Database on supabase/postgres:${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ["17.11.0.004", "15.19.0.004"]
    env:
      SUPABASE_PG_TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tests/integration/db/run.sh
      - if: always()
        run: tests/integration/stack/down.sh

  bridge:
    name: Bridge in an Apps Script runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: tests/integration/bridge/run.sh
      - if: always()
        run: tests/integration/stack/down.sh

  agent:
    name: Scripted agent runs the skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tests/integration/agent/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-runs
          path: |
            tests/integration/agent/.state/*/calls.jsonl
            tests/integration/agent/.state/*/report.json
          retention-days: 14
      - if: always()
        run: tests/integration/stack/down.sh

  google:
    name: Bridge in real Google
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.LIFEOS_E2E_CLASPRC_JSON }}
      LIFEOS_E2E_SCRIPT_ID: ${{ secrets.LIFEOS_E2E_SCRIPT_ID }}
      LIFEOS_E2E_DB_URL: ${{ secrets.LIFEOS_E2E_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Secrets configured?
        id: secrets
        run: |
          if [ -n "$CLASPRC_JSON" ] && [ -n "$LIFEOS_E2E_SCRIPT_ID" ] && [ -n "$LIFEOS_E2E_DB_URL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Real-Google suite skipped: set LIFEOS_E2E_CLASPRC_JSON, LIFEOS_E2E_SCRIPT_ID and LIFEOS_E2E_DB_URL (tests/integration/README.md)."
          fi
      - if: steps.secrets.outputs.ok == 'true'
        run: tests/integration/gas-e2e/run.sh
