<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8896A"/>
      <stop offset="1" stop-color="#C4553A"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F3EEE6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A1F10" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <!-- back sheets -->
  <rect x="150" y="104" width="220" height="286" rx="26" fill="#FFFFFF" opacity="0.28" transform="rotate(-9 260 247)"/>
  <rect x="146" y="112" width="220" height="286" rx="26" fill="#FFFFFF" opacity="0.5" transform="rotate(-3 256 255)"/>
  <!-- front sheet with folded corner -->
  <g filter="url(#shadow)">
    <path d="M168 122 h140 l62 62 v190 a26 26 0 0 1 -26 26 h-176 a26 26 0 0 1 -26 -26 v-226 a26 26 0 0 1 26 -26 z" fill="url(#sheet)"/>
    <path d="M308 122 v44 a18 18 0 0 0 18 18 h44 z" fill="#E7DED2"/>
  </g>
  <!-- text lines -->
  <rect x="180" y="196" width="112" height="14" rx="7" fill="#D8CEC1"/>
  <rect x="180" y="226" width="150" height="14" rx="7" fill="#E4DBD0"/>
  <rect x="180" y="256" width="128" height="14" rx="7" fill="#E4DBD0"/>
  <!-- done badge -->
  <circle cx="318" cy="332" r="46" fill="#1F2937"/>
  <path d="M297 332 l14 14 l28 -30" fill="none" stroke="#F5B49C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
